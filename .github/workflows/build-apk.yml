name: Build Android APK
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17" }
      - name: Prepare web assets for Capacitor
        run: |
          mkdir -p www && cp index.html styles.css manifest.webmanifest service-worker.js icon.svg db.js imaging.js ocr.js reader.js app.js www/ && cp -r vendor www/
      - run: npm install
      - name: Add Android project and sync
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK (installable, no keystore needed)
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SpineLeaf-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Attach APK to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: SpineLeaf ${{ github.ref_name }}
          body: "Free forever. Download app-debug.apk below and install it on Android (you may need to allow 'install from this source'). Or use the web / iOS home-screen version — see README."
